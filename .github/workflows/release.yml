name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify all version references match tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $errors = @()
          $checks = @(
            @{ File = 'scripts\build.ps1'; Pattern = '\$Version = "(.*)"'; Label = 'build.ps1' },
            @{ File = 'scripts\setup.iss'; Pattern = '#define MyAppVersion "(.*)"'; Label = 'setup.iss' },
            @{ File = 'scripts\build-portable.ps1'; Pattern = '\$Version = "(.*)"'; Label = 'build-portable.ps1' },
            @{ File = 'src\Properties\AssemblyInfo.cs'; Pattern = 'AssemblyVersion\("(.*)"\)'; Label = 'AssemblyInfo.cs (AssemblyVersion)' },
            @{ File = 'src\Properties\AssemblyInfo.cs'; Pattern = 'AssemblyFileVersion\("(.*)"\)'; Label = 'AssemblyInfo.cs (AssemblyFileVersion)' }
          )
          foreach ($check in $checks) {
            $match = Select-String -Path $check.File -Pattern $check.Pattern | Select-Object -First 1
            if (-not $match) { $errors += "Could not read version from $($check.Label)"; continue }
            $ver = $match.Matches.Groups[1].Value
            # AssemblyInfo uses 4-part (e.g. 2.0.0.0), others use 3-part (e.g. 2.0.0)
            if ($ver -eq "$tag.0") { $ver = $tag }
            if ($ver -ne $tag) { $errors += "$($check.Label): expected '$tag', found '$ver'" }
          }
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) { Write-Error $e }
            exit 1
          }
          echo "VERSION=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          echo "✓ All $($checks.Count) version references match: $tag"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Inno Setup
        run: choco install innosetup --confirm --no-progress

      - name: Build all (NuGet restore, x86, x64, Inno Setup installer, portable)
        shell: pwsh
        run: scripts\build.ps1

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Folder Prettifier ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/FolderPrettifier-Setup-*.exe
            dist/FolderPrettifier-Portable-x86-*.exe
            dist/FolderPrettifier-Portable-x64-*.exe
